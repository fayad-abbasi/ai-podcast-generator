name: AI Industry Weekly

on:
  schedule:
    - cron: '0 1 * * 4'  # 01:00 UTC Thursday = Wednesday 8 PM Eastern
  workflow_dispatch:       # Manual trigger for testing

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Setup ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history — needed for snapshot branch access

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # ── Credentials ────────────────────────────────
      - name: Decode Google TTS credentials
        run: |
          echo "${{ secrets.GOOGLE_TTS_CREDENTIALS }}" | base64 -d > /tmp/gcloud-tts.json

      # ── Run Pipeline ───────────────────────────────
      - name: Run podcast pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-tts.json
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/site
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          LOG_LEVEL: INFO
        run: python -m src.pipeline --source ai_industry

      # ── Publish Episode ────────────────────────────
      - name: Commit and push episode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f site/episodes/ site/feed.xml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add episode $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push && break
            echo "Push attempt $i failed, retrying in 30s..."
            sleep 30
          done

      # ── Update Snapshots ───────────────────────────
      - name: Update snapshot branch
        run: |
          # `snapshots` is a standalone branch holding only the diff baseline.
          # diff.py reads it with `git show origin/snapshots:snapshots/<x>.json`
          # — the tip blob, no checkout — so the branch's history carries no
          # value and is rebuilt from scratch on every run. Rebuilding as an
          # orphan guarantees the branch contains the payload and nothing else,
          # and needs no fetch and no create-vs-update branching.
          #
          # The previous implementation ran `git checkout origin/snapshots -- .`
          # before `git checkout -B snapshots`. That is a *pathspec* checkout:
          # it restores files but leaves HEAD on main, so -B re-pointed the
          # branch at main's commit. Every run re-parented `snapshots` onto
          # main and force-pushed a full copy of the repository — MP3s included
          # — to store six JSON files.
          if [ ! -d "snapshots" ] || [ -z "$(ls -A snapshots/ 2>/dev/null)" ]; then
            echo "No snapshot files to update"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the payload before detaching — the orphan checkout clears the tree
          rm -rf /tmp/snapshots-staging
          cp -r snapshots/ /tmp/snapshots-staging/

          # Build a fresh, parentless branch containing only the snapshots
          git checkout --orphan snapshots-tmp
          git rm -rf . --quiet 2>/dev/null || true
          rm -rf snapshots/

          mkdir -p snapshots/
          cp -r /tmp/snapshots-staging/* snapshots/
          git add -f snapshots/
          git commit -m "Update snapshots $(date -u +%Y-%m-%d)"
          git push --force origin snapshots-tmp:snapshots

          # Return to main branch (-f: the orphan checkout leaves the tree dirty)
          git checkout -f main

      # ── Cleanup ────────────────────────────────────
      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/gcloud-tts.json

      # ── Failure alert ──────────────────────────────
      - name: Slack alert on failure
        if: failure() && env.SLACK_WEBHOOK_INBOX != ''
        env:
          SLACK_WEBHOOK_INBOX: ${{ secrets.SLACK_WEBHOOK_INBOX }}
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":rotating_light: Workflow *${{ github.workflow }}* failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_INBOX"
